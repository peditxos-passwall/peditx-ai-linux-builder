name: build-and-release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (peditx/PeDitX-AI)
        uses: actions/checkout@v4
        with:
          repository: peditx/PeDitX-AI
          token: ${{ secrets.PEDITX_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build single-file binary
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m PyInstaller --noconfirm --onefile --name PeDitX-AI --add-data "web:web" --add-data "assets:assets" --paths src src/peditx_ai.py
      - name: Create AppImage
        run: |
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool
          mkdir -p PeDitX-AI.AppDir/usr/bin
          cp dist/PeDitX-AI PeDitX-AI.AppDir/usr/bin/
          mkdir -p PeDitX-AI.AppDir/usr/share/icons/hicolor/256x256/apps
          cp assets/peditx-ai.png PeDitX-AI.AppDir/usr/share/icons/hicolor/256x256/apps/
          cat > PeDitX-AI.AppDir/PeDitX-AI.desktop << 'DESKTOP_EOF'
[Desktop Entry]
Type=Application
Name=PeDitX-AI
Exec=PeDitX-AI
Icon=peditx-ai
Categories=Utility;
Terminal=false
DESKTOP_EOF
          cp PeDitX-AI.AppDir/usr/share/icons/hicolor/256x256/apps/peditx-ai.png PeDitX-AI.AppDir/peditx-ai.png
          ./appimagetool PeDitX-AI.AppDir PeDitX-AI-x86_64.AppImage
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: peditx-ai-linux
          path: PeDitX-AI-x86_64.AppImage
          if-no-files-found: error
      - name: Create GitHub Release on peditx/PeDitX-AI
        if: ${{ github.event.inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.PEDITX_TOKEN }}
        run: |
          gh release create ${{ github.event.inputs.tag }} \
            PeDitX-AI-x86_64.AppImage \
            --repo peditx/PeDitX-AI \
            --title "PeDitX-AI ${{ github.event.inputs.tag }}" \
            --notes "Linux AppImage – built by CI on peditxos-passwall/peditx-ai-linux-builder"
        shell: bash
